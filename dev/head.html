<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- ホーム画面に追加して開くと、アドレスバーなしの全画面で表示される -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ピタゴラ６">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ピタゴラ６</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;font-family:'BIZ UDPGothic',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#bfe3f5;color:#333}
rt{font-size:.55em;font-weight:400}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;font-weight:700;border:0;border-radius:12px;min-width:44px;min-height:44px;cursor:pointer;color:#333}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#top{right:auto}
#homeBtn,#helpBtn{width:48px;height:48px;border-radius:50%;font-size:22px;background:#fff;box-shadow:0 2px 0 #0002;flex:none;padding:0}
#mission{position:fixed;top:8px;left:118px;background:#fffc;border-radius:10px;padding:2px 12px;font-size:16px;font-weight:700;line-height:1.9;max-width:calc(100vw - 126px);pointer-events:none}
#banner{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:8px 14px;
  font-size:19px;font-weight:700;box-shadow:0 3px 0 #0003;display:none;align-items:center;gap:12px;width:max-content;max-width:94vw;line-height:1.7}
#banner.win{background:#fff3b0}#banner.fail{background:#ffe1dc}
#banner button{background:#2e9e5b;color:#fff;font-size:18px;padding:0 14px;white-space:nowrap}
#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#333d;color:#fff;border-radius:12px;padding:10px 18px;font-size:18px;font-weight:700;display:none;pointer-events:none;z-index:5}
#panel{position:fixed;left:0;right:0;bottom:0;background:#fffd;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:6px;border-top:2px solid #0001}
#timeRow{display:flex;gap:6px;align-items:center}
#timeRow button{background:#e8eef2;font-size:14px;padding:0 10px;white-space:nowrap}
#timeRow button.on{background:#7fd0ff}
#clearBtn.warn{background:#ffb3a8}
#timeLbl{font-size:14px;font-weight:700;white-space:nowrap}
#time{flex:1;min-width:60px;height:44px;margin:0;accent-color:#e8590c}
#time:disabled{opacity:.3}
#row{display:flex;gap:8px;align-items:stretch}
#palette{flex:1;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.pbtn{flex:none;width:86px;height:74px;background:#f1f5f8;box-shadow:0 2px 0 #0002;font-size:12px;line-height:1.2;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pbtn svg{width:48px;height:34px;pointer-events:none}
.pbtn:active{background:#d5e9f5}
#go{width:112px;background:#e8590c;color:#fff;font-size:20px;box-shadow:0 3px 0 #0003;line-height:1.3;flex:none}
#go.stop{background:#555}
.wbtn{flex:none;min-width:74px;height:74px;background:#f1f5f8;box-shadow:0 2px 0 #0002;font-size:15px;line-height:1.25;padding:2px 10px;white-space:nowrap}
.wbtn.on{background:#ffe066}
.wbtn .big{font-size:24px;display:block}
.wname{flex:none;align-self:center;font-size:16px;font-weight:700;padding:0 6px;white-space:nowrap}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:240px;background:#fff8d6;border:2px solid #f2c200;border-radius:12px;padding:4px 12px;font-size:15px;font-weight:700;line-height:1.8;display:none;max-width:96vw;width:max-content;text-align:center;pointer-events:none}
.pbtn{position:relative}.pbtn .nw{position:absolute;top:-4px;right:-2px;background:#e03131;color:#fff;font-size:11px;border-radius:8px;padding:0 5px;line-height:16px}
.pbtn.isnew{outline:3px solid #ffd54a}
#mission b{background:#ffe9a8;border-radius:6px;padding:0 4px}
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:170px;background:#fff;border-radius:14px;padding:6px 8px;box-shadow:0 3px 0 #0003;display:none;gap:6px;align-items:center;max-width:98vw}
#selbar span{font-size:15px;font-weight:700;padding:0 4px;white-space:nowrap}
#selbar button{background:#e8eef2;font-size:16px;padding:0 10px;min-height:48px;min-width:48px;white-space:nowrap}
#selbar #delBtn{background:#ffd9d4}
#selbar #optBtn{background:#d3f0dc}
@media (max-width:900px){#go{width:80px;font-size:16px}}
@media (max-width:640px){#timeLbl{display:none}#selbar span{display:none}.pbtn{width:74px}}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
.modal.open{display:flex}
.box{background:#fff;border-radius:18px;padding:14px 18px;max-width:640px;width:100%;max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch}
.box h2{margin:0 0 6px;font-size:22px;text-align:center}
.box li{font-size:17px;line-height:1.9;margin-bottom:2px}
.box ol{padding-left:0;list-style:none;margin:6px 0}
.box .ic{display:inline-block;width:34px;text-align:center;font-size:20px}
.box svg{width:100%;height:auto;background:#eef7fc;border-radius:12px}
#home{position:fixed;inset:0;z-index:8;background:linear-gradient(#bfe3f5 0%,#e9f6fc 55%,#fdf3dc 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch}
#home.hide{display:none}
#hTitle{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#hTitle h1{margin:0;font-size:58px;letter-spacing:2px;color:#333;text-shadow:0 4px 0 #fff}
#hTitle svg{width:150px;height:72px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,340px));gap:16px;width:100%;justify-content:center}
.card{background:#fff;border-radius:26px;padding:12px 14px 14px;box-shadow:0 6px 0 #0002;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;color:#333;min-height:150px}
button.card:active,.sub button:active{transform:translateY(3px);box-shadow:0 3px 0 #0002}
.card .ci{font-size:46px;line-height:1.1}
.card .ct{font-size:30px}
.card .cs{font-size:15px;font-weight:400;color:#555;line-height:1.7}
.card.c1{background:#fff1b8}.card.c2{background:#d6efff}.card.c3{background:#d8f5e1}.card.c4{background:#ffe0d8}
.sub{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.sub button{background:#fff;font-size:17px;padding:0 11px;min-height:54px;box-shadow:0 3px 0 #0002}
#homeHelp{position:fixed;top:10px;left:10px;width:52px;height:52px;border-radius:50%;font-size:26px;background:#fff;box-shadow:0 2px 0 #0002;z-index:9}
#busy .box{text-align:center;font-size:22px;font-weight:700;max-width:340px;padding:22px}
#busy .gear{display:inline-block;font-size:48px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#helpSub{text-align:center;font-size:17px;font-weight:700;background:#fff3b0;border-radius:10px;padding:2px 8px;margin:0 0 6px}
#startBtn{display:block;margin:8px auto 0;background:#e8590c;color:#fff;font-size:22px;padding:0 36px;min-height:56px}
#ver{position:fixed;right:6px;top:3px;z-index:9;font-size:10px;color:#0006;pointer-events:none}

/* ==== スマホ用パネル調整：スマホ（画面が低いとき）だけに効く。iPadには影響しない ==== */
@media (orientation:landscape) and (max-height:500px), (orientation:portrait) and (max-height:700px){
  .modal{padding:58px 10px 8px}
  .box{max-height:calc(100vh - 66px);max-height:calc(100dvh - 66px);padding-top:8px;padding-bottom:0}
  #startBtn,#introClose{position:sticky;bottom:6px;z-index:5;box-shadow:0 0 0 100vmax #fff;clip-path:inset(-8px -100vmax)}
}
@media (orientation:landscape) and (max-height:500px){
  #home{justify-content:flex-start;padding-top:6px}
  #hTitle{margin-bottom:2px}#hTitle h1{font-size:30px}#hTitle svg{width:80px;height:38px}
  .cards{grid-template-columns:repeat(2,minmax(0,320px));gap:8px}
  .card{min-height:0;padding:4px 8px 6px;border-radius:18px;flex-direction:row;flex-wrap:wrap;gap:4px 8px}
  .card .ci{font-size:26px}.card .ct{font-size:20px}.card .cs{display:none}
  .sub{margin-top:0;width:100%}.sub button{font-size:15px;min-height:44px;padding:0 10px}
  #homeHelp{width:44px;height:44px;font-size:22px;top:6px;left:6px}
  /* ゲーム画面：床が見えるように、文字と下のパネルを小さくする */
  #mission{font-size:13px;line-height:1.7;padding:0 8px;left:110px}
  #homeBtn,#helpBtn{width:44px;height:44px;font-size:20px}
  #panel{padding-top:3px;gap:3px}
  .pbtn,.wbtn{height:56px}.pbtn svg{height:24px}.wbtn .big{font-size:18px}.wbtn{font-size:13px;min-width:60px;padding:0 6px}
  #go{height:56px;font-size:15px}
  #tip{display:none!important}
  .box h2{font-size:18px;margin-bottom:4px}
  .box svg{max-height:56px}
  .box li{font-size:14px;line-height:1.55;margin-bottom:0}
}
@media (orientation:portrait) and (max-width:500px){
  #home{justify-content:flex-start}
  #hTitle h1{font-size:40px}#hTitle svg{width:100px;height:48px}
  .cards{grid-template-columns:minmax(0,1fr);gap:10px}
  .card{min-height:0;padding:8px 10px 10px}
  .card .ci{font-size:34px}.card .ct{font-size:24px}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<!-- build: 2026-11-15 pitagora6-6 -->
<canvas id="c"></canvas>
<div id="top">
  <button id="homeBtn" aria-label="さいしょの ページに もどる">🏠</button>
  <button id="helpBtn" aria-label="あそびかた">？</button>
</div>
<div id="mission"></div>
<div id="banner"><span id="bannerTxt"></span><button id="bannerBtn"></button></div>
<div id="toast"></div>
<div id="tip"></div>
<div id="selbar"><span id="selName"></span><button id="rotL" aria-label="ひだりに まわす">↺</button><button id="rotR" aria-label="みぎに まわす">↻</button><button id="optBtn"></button><button id="delBtn">🗑 けす</button></div>
<div id="panel">
  <div id="timeRow">
    <button id="slowBtn">🐢 ゆっくり</button>
    <span id="timeLbl">⏪ <ruby>時間<rt>じかん</rt></ruby></span>
    <input id="time" type="range" min="0" max="0" value="0" step="1" disabled>
    <button id="clearBtn"></button>
    <button id="viewBtn">🔄 <ruby>視点<rt>してん</rt></ruby></button>
    <button id="camBtn">🔍 おいかける</button>
  </div>
  <div id="row"><div id="palette"></div><button id="go">▶<br>スタート</button></div>
</div>
<div id="help" class="modal"><div class="box">
  <h2>ピタゴラ６ あそび<ruby>方<rt>かた</rt></ruby></h2>
  <div id="helpSub"></div>
  <svg viewBox="0 0 600 150" aria-hidden="true">
    <path d="M70 18 H530 L590 138 H10 Z" fill="#fbf3df" stroke="#c9a15e" stroke-width="5" stroke-linejoin="round"/>
    <path d="M60 52 L60 92 L130 92 Z" fill="#e2b377" stroke="#b07a3a" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="70" cy="50" r="11" fill="#e03131"/><rect x="59" y="47" width="22" height="6" fill="#fff"/>
    <path d="M140 86 h40 v-7 l14 11 l-14 11 v-7 h-40z" fill="#f2c200"/>
    <g fill="#f08c00"><rect x="215" y="58" width="7" height="34"/></g><g fill="#2e9e5b"><rect x="240" y="58" width="7" height="34"/></g><g fill="#1c7ed6"><rect x="265" y="58" width="7" height="34"/></g>
    <circle cx="305" cy="82" r="11" fill="#1c7ed6"/>
    <path d="M335 70 h44 l8 26 h-60z" fill="#f08c00"/><path d="M357 92 v-12 h-6 l10 -9 l10 9 h-6 v12z" fill="#ffe066"/>
    <path d="M361 66 Q372 30 430 40" fill="none" stroke="#1c7ed6" stroke-width="3" stroke-dasharray="6 6"/>
    <ellipse cx="470" cy="46" rx="34" ry="13" fill="#fff8d6" stroke="#f2c200" stroke-width="6"/>
    <line x1="505" y1="8" x2="505" y2="44" stroke="#555" stroke-width="4"/><path d="M505 8 L535 16 L505 26Z" fill="#ffd54a" stroke="#555"/>
    <g transform="translate(250,118)"><circle r="16" fill="#fff" stroke="#333" stroke-width="2"/><text y="7" text-anchor="middle" font-size="20">👆</text></g>
  </svg>
  <ol id="helpList"></ol>
  <button id="startBtn">はじめる</button>
</div></div>
<div id="busy" class="modal"><div class="box"><span class="gear">⚙️</span><br>つくっています…</div></div>
<div id="home">
  <div id="hTitle">
    <svg viewBox="0 0 150 72" aria-hidden="true">
      <path d="M6 18 L6 62 L58 62 Z" fill="#e2b377" stroke="#b07a3a" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="16" cy="14" r="10" fill="#e03131"/><rect x="6" y="11" width="20" height="5" fill="#fff"/>
      <g><rect x="68" y="32" width="6" height="30" rx="1" fill="#f08c00"/><rect x="82" y="32" width="6" height="30" rx="1" fill="#2e9e5b"/><rect x="96" y="32" width="6" height="30" rx="1" fill="#1c7ed6"/></g>
      <ellipse cx="128" cy="62" rx="18" ry="6" fill="#fff8d6" stroke="#f2c200" stroke-width="4"/>
      <line x1="140" y1="8" x2="140" y2="60" stroke="#555" stroke-width="3"/><path d="M140 8 L120 15 L140 23Z" fill="#ffd54a" stroke="#555"/>
    </svg>
    <h1>ピタゴラ６</h1>
  </div>
  <div class="cards">
    <div class="card c1"><div class="ci">🔰</div><div class="ct">れんしゅう</div><div class="cs">パーツの つかいかたを おぼえよう</div>
      <div class="sub"><button data-go="lesson" data-n="0">レベル1</button><button data-go="lesson" data-n="1">レベル2</button><button data-go="lesson" data-n="2">レベル3</button></div></div>
    <button class="card c2" data-go="watch"><div class="ci">👀</div><div class="ct">みる</div><div class="cs">できあがった そうちを <ruby>見<rt>み</rt></ruby>よう</div></button>
    <button class="card c3" data-go="free"><div class="ci">🛠️</div><div class="ct">つくる</div><div class="cs">すきな そうちを つくろう</div></button>
    <div class="card c4"><div class="ci">🔧</div><div class="ct">なおして ゴール</div><div class="cs">ぬけた パーツを もどして ゴールさせよう</div>
      <div class="sub"><button data-go="fix" data-n="1">かんたん</button><button data-go="fix" data-n="2">ふつう</button><button data-go="fix" data-n="3">むずかしい</button></div></div>
  </div>
  <button id="homeHelp" aria-label="あそびかた">？</button>
</div>
<div id="ver">v2026-11-15 ピタゴラ６-6</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
